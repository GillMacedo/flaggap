apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jobs
spec:
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: registry.example.com/jobs/worker:2.0.0
          args:
            - run
            - --concurrency=8
            - --queue=emails
            - --poll-interval=30s
            - --dry-run=false
            - --metrics-bind-address=:9090
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: jobs
spec:
  selector: {app: worker}
  ports:
    - port: 9090
